  <nav class="navbar navbar-expand-lg">
    <div class="container">

    <div class="form-section">
      <h2>Registrar nuevo usuario</h2>
      <form action="../back/formulario_registro.php" method="get" autocomplete="off">
        <div class="mb-3">
          <label for="n" class="form-label">Nombre de usuario</label>
          <input type="text" class="form-control" id="n" name="n" placeholder="Ingrese su nombre de usuario" required>
        </div>

        <div class="mb-3">
          <label for="ce" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="ce" name="ce" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="mb-3">
          <label for="ca" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="ca" name="ca" placeholder="Ingrese una contraseña" required>
        </div>

        <div class="mb-3">
          <label for="cc" class="form-label">Confirmar contraseña</label>
          <input type="password" class="form-control" id="cc" name="cc" placeholder="Repita la contraseña" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Registrar</button>

        <div class="text-center mt-3">
          <a href='../../home_page.html'>Volver al incio</a>
        </div>
