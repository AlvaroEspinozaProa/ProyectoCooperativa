<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width: 500px;">
    <section class="card shadow-sm"><div class="card-body p-4">
      <h1 class="h3">Recuperar contraseña</h1>
      <p class="text-muted">Te enviaremos un enlace para elegir una nueva contraseña.</p>
      <form autocomplete="off" id="recoveryForm">
        <div class="mb-3"><label class="form-label" for="u">Correo electrónico</label><input class="form-control" id="u" name="email" placeholder="ejemplo@correo.com" required type="email"></div>
        <button class="btn btn-primary w-100" type="submit">Enviar enlace</button>
        <div class="text-center mt-3"><a href="../../home_page.html">Volver al login</a></div>
        <div class="alert d-none" id="authMessage" role="status"></div>
      </form>
    </div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/supabase.js"></script>
  <script src="../../assets/js/auth.js"></script>
</body>
</html>
