<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Registrar - AgroCoop</title><script src="https://unpkg.com/@phosphor-icons/web"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>:root {  --primary: #0f4c81; --primary-light: #41729f; --primary-dark: #093156;  --secondary: #e2e8f0; --background: #f1f5f9; --surface: #ffffff;  --text-main: #1e293b; --text-muted: #64748b; --border: #cbd5e1;  --danger: #dc2626; --success: #16a34a; --warning: #d97706;  --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);  --radius-sm: 4px; --radius-md: 8px;}* { margin: 0; padding: 0; box-sizing: border-box; }body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--background); color: var(--text-main); line-height: 1.5; }.navbar { background-color: var(--primary); color: white; padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm); }.navbar-left, .navbar-right { display: flex; align-items: center; gap: 24px; }.brand { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 10px; color: white; text-decoration: none; }.brand i { color: #fbbf24; font-size: 1.5rem; }.nav-link { color: rgba(255,255,255,0.8); text-decoration: none; padding: 18px 12px; font-weight: 500; font-size: 0.95rem; border-bottom: 3px solid transparent; transition: all 0.2s; }.nav-link:hover, .nav-link.active { color: white; background-color: rgba(255,255,255,0.1); }.nav-link.active { border-bottom-color: #fbbf24; }.main-content { max-width: 1200px; margin: 40px auto; padding: 0 20px; }.page-header { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-end; }.page-header h1 { font-size: 1.6rem; color: var(--primary-dark); }.page-header p { color: var(--text-muted); }.card { background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border); box-shadow: var(--shadow-sm); padding: 24px; margin-bottom: 24px; }.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }.grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }.stat-card { padding: 20px; border-radius: var(--radius-sm); border: 1px solid var(--border); border-top: 4px solid var(--primary-light); background: var(--surface); display: flex; justify-content: space-between; align-items: center; }.stat-details h3 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; }.stat-details .value { font-size: 1.8rem; font-weight: 700; color: var(--text-main); }.stat-icon { font-size: 2.5rem; color: var(--border); }.modern-table { width: 100%; border-collapse: collapse; text-align: left; }.modern-table th { background: var(--background); padding: 12px; font-size: 0.85rem; color: var(--primary-dark); border-bottom: 2px solid var(--border); }.modern-table td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }.modern-table tr:hover td { background: #f8fafc; }.badge { padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }.badge-warning { background: #fef3c7; color: #d97706; }.badge-info { background: #e0f2fe; color: #0284c7; }.badge-success { background: #dcfce7; color: #16a34a; }.form-group { margin-bottom: 16px; }.form-label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }.form-control { width: 100%; padding: 8px 12px; border: 1px solid #94a3b8; border-radius: var(--radius-sm); font-family: inherit; font-size: 0.95rem; }.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; border: none; text-decoration: none; }.btn-primary { background: var(--primary); color: white; }.btn-secondary { background: var(--secondary); color: var(--text-main); }</style><script>document.addEventListener('contextmenu', event => event.preventDefault());document.onkeydown = function (e) {    if(e.keyCode == 123) return false;    if(e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 67 || e.keyCode == 74)) return false;    if(e.ctrlKey && e.keyCode == 85) return false;};</script></head><body><header class="navbar"><div class="navbar-left"><a href="dashboard.html" class="brand"><i class="ph-fill ph-plant"></i>AgroCoop</a><nav style="display:flex;"><a href="dashboard.html" class="nav-link ">Inicio</a><a href="ingreso_camion.html" class="nav-link active">Balanza / Ingreso</a><a href="reportes.html" class="nav-link ">Reportes</a><a href="productores.html" class="nav-link ">Productores</a><a href="configuracion.html" class="nav-link ">Configuración</a></nav></div><div class="navbar-right"><span style="font-size:0.9rem;"><i class="ph-fill ph-user-circle"></i> Admin</span><a href="login.html" class="btn btn-secondary" style="padding: 4px 10px; font-size:0.8rem;">Salir</a></div></header><main class="main-content"><header class="page-header"><div><h1>Registrar Carta de Porte</h1><p>Balanza de entrada - Ticket de peso</p></div></header><div class="card"><form action="reportes.html"><div class="grid-2"><div><h3 style="color:var(--primary); margin-bottom:12px;">Datos del Transporte</h3><div class="grid-2" style="gap:12px;"><div class="form-group"><label class="form-label">Patente Chasis</label><input type="text" class="form-control" placeholder="ABC 123"></div><div class="form-group"><label class="form-label">Patente Acoplado</label><input type="text" class="form-control" placeholder="XYZ 987"></div></div><div class="form-group"><label class="form-label">Chofer (Nombre y Apellido)</label><input type="text" class="form-control"></div><div class="form-group"><label class="form-label">CUIT Chofer / Transportista</label><input type="text" class="form-control"></div></div><div><h3 style="color:var(--primary); margin-bottom:12px;">Datos de la Carga</h3><div class="form-group"><label class="form-label">Productor / Razón Social</label><select class="form-control"><option>Los Hermanos S.R.L.</option><option>Agro Norte S.A.</option></select></div><div class="form-group"><label class="form-label">Tipo de Grano</label><select class="form-control"><option>Soja</option><option>Maíz</option><option>Trigo</option></select></div><div class="grid-2" style="gap:12px;"><div class="form-group"><label class="form-label">Peso Bruto (Kg)</label><input type="number" class="form-control"></div><div class="form-group"><label class="form-label">Tara (Kg)</label><input type="number" class="form-control"></div></div><div class="grid-2" style="gap:12px;"><div class="form-group"><label class="form-label">% Humedad</label><input type="number" class="form-control" placeholder="13.5"></div><div class="form-group"><label class="form-label">% Zarandeo/Merma</label><input type="number" class="form-control" placeholder="1.2"></div></div></div></div><div style="border-top:1px solid var(--border); padding-top:16px; margin-top:16px; text-align:right;"><button type="submit" class="btn btn-primary">Imprimir Ticket y Guardar</button></div></form></div></main></body></html>
